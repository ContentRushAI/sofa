<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ContentRushAI Furniture AR</title>

<script type="module"
src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js">
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#1e293b);
overflow:hidden;
}

model-viewer{
width:100vw;
height:100vh;
background:transparent;
}

.top-panel{
position:absolute;
top:18px;
left:50%;
transform:translateX(-50%);
z-index:100;

width:92%;
max-width:650px;

backdrop-filter:blur(18px);

background:rgba(255,255,255,0.08);

border:1px solid rgba(255,255,255,0.12);

border-radius:24px;

padding:18px 22px;

display:flex;
justify-content:space-between;
align-items:center;
}

.brand{
display:flex;
align-items:center;
gap:12px;
}

.logo{
width:52px;
height:52px;
object-fit:contain;
}

.brand-name{
font-size:24px;
font-weight:700;
color:white;
}

.price-box{
text-align:right;
}

.label{
font-size:12px;
letter-spacing:2px;
color:#94a3b8;
}

.price{
font-size:28px;
font-weight:700;
color:#38bdf8;
}

#ar-button{
position:absolute;
top:110px;
left:50%;
transform:translateX(-50%);

z-index:100;

border:none;

background:linear-gradient(135deg,#38bdf8,#06b6d4);

color:white;

padding:15px 34px;

font-size:18px;
font-weight:600;

border-radius:18px;

box-shadow:0 10px 30px rgba(56,189,248,.35);

cursor:pointer;
}

#ar-button:hover{
transform:translateX(-50%) scale(1.03);
}

.product-tag{
position:absolute;
bottom:25px;
left:50%;
transform:translateX(-50%);

z-index:100;

background:rgba(255,255,255,0.08);

backdrop-filter:blur(18px);

border-radius:20px;

padding:14px 28px;

color:white;

font-size:20px;
font-weight:600;

border:1px solid rgba(255,255,255,0.12);
}

</style>
</head>

<body>

<div class="top-panel">

<div class="brand">
<img src="logo.png" class="logo">
<div class="brand-name">ContentRushAI</div>
</div>

<div class="price-box">
<div class="label">PRICE</div>
<div class="price">₹5000</div>
</div>

</div>

<model-viewer
src="sofa.glb"
scale="1 1 1"
ar
ar-modes="scene-viewer webxr quick-look"
camera-controls
auto-rotate
shadow-intensity="1"
environment-image="neutral">

<button slot="ar-button" id="ar-button">
View In AR
</button>

</model-viewer>

<div class="product-tag">
Luxury Sofa
</div>

</body>
</html>
